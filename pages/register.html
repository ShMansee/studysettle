<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />
  <title>Register • StudySettle</title>
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <div class="nav-brand">
      <a href="../index.html" class="nav-logo">Study<span>Settle</span></a>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="../index.html"       data-i18n="nav_home">Home</a></li>
      <li><a href="documents.html"      data-i18n="nav_documents">Documents</a></li>
      <li><a href="housing.html"        data-i18n="nav_housing">Housing</a></li>
      <li><a href="explore.html"        data-i18n="nav_explore">Explore</a></li>
      <li><a href="essentials.html"     data-i18n="nav_essentials">Essentials</a></li>
      <li><a href="login.html"          data-i18n="nav_login">Login</a></li>
      <li><a href="register.html"       data-i18n="nav_register">Register</a></li>
      <li><a href="dashboard.html"      data-i18n="nav_dashboard">Dashboard</a></li>
    </ul>
    <div class="nav-controls">
      <div class="lang-buttons">
        <button class="lang-btn" id="lang-en">EN</button>
        <button class="lang-btn" id="lang-az">AZ</button>
        <button class="lang-btn" id="lang-ru">RU</button>
      </div>
    </div>
  </nav>
</header>

<main>
  <div class="form-card">
    <div class="card-icon" style="text-align:center;font-size:2.5rem;margin-bottom:8px">🎓</div>
    <h1 data-i18n="nav_register">Register</h1>
    <p class="subtitle" data-i18n="subtitle">Your student relocation helper for Baku</p>

    <form>
      <div class="form-group">
        <label for="reg-name" data-i18n="lbl_name">Full name</label>
        <input type="text" id="reg-name" placeholder="Your full name" autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="reg-email" data-i18n="lbl_email">Email address</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="reg-university" data-i18n="lbl_university">University</label>
        <select id="reg-university">
          <option value="">— Select your university —</option>
          <option value="ada">ADA University</option>
          <option value="baku-state">Baku State University</option>
          <option value="unec">UNEC</option>
          <option value="khazar">Khazar University</option>
        </select>
      </div>
      <div class="form-group">
        <label for="reg-password" data-i18n="lbl_password">Password</label>
        <input type="password" id="reg-password" placeholder="At least 8 characters" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="reg-confirm" data-i18n="lbl_confirm_password">Confirm password</label>
        <input type="password" id="reg-confirm" placeholder="Repeat your password" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" data-i18n="btn_register">Create Account</button>
    </form>

    <p class="form-footer">
      <span data-i18n="link_have_account">Already have an account?</span>
      <a href="login.html" data-i18n="link_login">Login</a>
    </p>
  </div>
</main>

<footer class="site-footer">
  <p>&copy; 2025 StudySettle Baku &mdash; Helping international students settle in Azerbaijan.</p>
</footer>

<script type="module" src="../js/app.js"></script>
</body>
</html>
